<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-red-900 text-red-100 overflow-hidden">
    <!-- UnicornStudio Background -->
    <div data-us-project="qF3qXhdiOxdUeQYH8wCK" class="absolute top-0 left-0 -z-10 w-full h-full"></div>

    <!-- Main Container -->
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-red-400/20 backdrop-blur-sm bg-red-800/20">
            <div class="flex items-center gap-3">
                <button class="lg:hidden p-2 hover:bg-red-400/20 rounded-lg transition-colors">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-2">
                    <div class="font-semibold text-sm tracking-tight">ChatGPT</div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button class="hidden sm:flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-red-400/20 rounded-lg transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden md:inline">New chat</span>
                </button>
                <button class="p-2 hover:bg-red-400/20 rounded-lg transition-colors">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <div class="flex-1 overflow-y-auto">
            <div class="max-w-3xl mx-auto px-4 py-8">
                <!-- Welcome State -->
                <div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
                    <div class="mb-8">
                        <div class="w-16 h-16 rounded-2xl bg-red-400/10 backdrop-blur-sm flex items-center justify-center mb-6 mx-auto">
                            <i data-lucide="message-square" class="w-8 h-8"></i>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-semibold tracking-tight mb-3">How can I help you today?</h1>
                        <p class="text-red-200 text-sm md:text-base">Ask me anything or try one of the suggestions below</p>
                    </div>

                    <!-- Suggestion Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl mt-8">
                        <button class="group p-4 rounded-xl border border-red-400/20 bg-red-400/10 backdrop-blur-sm hover:bg-red-400/20 transition-all text-left">
                            <div class="flex items-start gap-3">
                                <i data-lucide="lightbulb" class="w-5 h-5 text-red-200 group-hover:text-red-100 transition-colors mt-0.5"></i>
                                <div>
                                    <div class="text-sm font-medium mb-1">Get creative ideas</div>
                                    <div class="text-xs text-red-300">for a new project or campaign</div>
                                </div>
                            </div>
                        </button>

                        <button class="group p-4 rounded-xl border border-red-400/20 bg-red-400/10 backdrop-blur-sm hover:bg-red-400/20 transition-all text-left">
                            <div class="flex items-start gap-3">
                                <i data-lucide="code" class="w-5 h-5 text-red-200 group-hover:text-red-100 transition-colors mt-0.5"></i>
                                <div>
                                    <div class="text-sm font-medium mb-1">Help me debug</div>
                                    <div class="text-xs text-red-300">my code or explain a concept</div>
                                </div>
                            </div>
                        </button>

                        <button class="group p-4 rounded-xl border border-red-400/20 bg-red-400/10 backdrop-blur-sm hover:bg-red-400/20 transition-all text-left">
                            <div class="flex items-start gap-3">
                                <i data-lucide="book-open" class="w-5 h-5 text-red-200 group-hover:text-red-100 transition-colors mt-0.5"></i>
                                <div>
                                    <div class="text-sm font-medium mb-1">Explain a topic</div>
                                    <div class="text-xs text-red-300">in simple terms I can understand</div>
                                </div>
                            </div>
                        </button>

                        <button class="group p-4 rounded-xl border border-red-400/20 bg-red-400/10 backdrop-blur-sm hover:bg-red-400/20 transition-all text-left">
                            <div class="flex items-start gap-3">
                                <i data-lucide="pen-line" class="w-5 h-5 text-red-200 group-hover:text-red-100 transition-colors mt-0.5"></i>
                                <div>
                                    <div class="text-sm font-medium mb-1">Write content</div>
                                    <div class="text-xs text-red-300">for my blog or social media</div>
                                </div>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t border-red-400/20 backdrop-blur-sm bg-red-800/20">
            <div class="max-w-3xl mx-auto px-4 py-4">
                <div class="relative">
                    <div class="flex items-end gap-3 p-3 rounded-2xl border border-red-400/30 bg-red-400/10 backdrop-blur-sm focus-within:border-red-400/50 transition-colors">
                        <button class="p-2 hover:bg-red-400/20 rounded-lg transition-colors flex-shrink-0">
                            <i data-lucide="paperclip" class="w-5 h-5"></i>
                        </button>

                        <textarea rows="1" placeholder="Message ChatGPT..." class="flex-1 bg-transparent resize-none outline-none placeholder:text-red-300 max-h-32" style="field-sizing: content;"></textarea>

                        <button class="p-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i data-lucide="arrow-up" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-center gap-4 mt-3 text-xs text-red-300">
                    <span>ChatGPT can make mistakes. Consider checking important information.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- UnicornStudio Script -->
    <script type="text/javascript">
      !function(){if(!window.UnicornStudio){window.UnicornStudio={isInitialized:!1};var i=document.createElement("script");i.src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v1.4.29/dist/unicornStudio.umd.js",i.onload=function(){window.UnicornStudio.isInitialized||(UnicornStudio.init(),window.UnicornStudio.isInitialized=!0)},(document.head || document.body).appendChild(i)}}();
    </script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons({
            strokeWidth: 1.5
        });
    </script>

</body></html>
